# Example configuration for coldsearch
# Copy to ~/.config/coldsearch/config.toml and customize
# The runtime also falls back to ~/.config/usearch/config.toml for compatibility.

# ============================================
# CAPABILITY CONFIGURATION
# ============================================
# Each capability maps to one or more providers.
# strategy = "random"  → Pick one random provider per request
# strategy = "all"     → Fan out to all providers (for search with reranking)

[capabilities.search]
# Search across the web - 5 providers with random selection
providers = ["searxng", "tavily", "exa", "brave", "serper"]
strategy = "random"

[capabilities.extract]
# Extract content from URLs - 3 providers with random selection
providers = ["tavily", "exa", "jina"]
strategy = "random"

[capabilities.crawl]
# Crawl websites - random selection (use strategy = "all" for sequential failover)
providers = ["tavily", "firecrawl", "exa"]
strategy = "random"

# ============================================
# PROVIDER CONFIGURATION
# ============================================
# Each provider has its own key pool.
# strategy = "random"      → Pick random key per request
# strategy = "round-robin" → Cycle through keys (default)
#
# Key reference formats (preferred to least preferred):
#   doppler:SECRET_NAME   → Doppler secret (preferred — use this)
#   env:VAR_NAME          → Environment variable (fallback)
#   bws:SECRET_NAME       → REMOVED — Bitwarden refs now raise an error; migrate to doppler:/env:
#
# DOPPLER AUTHENTICATION:
#   Dev machine:     Run `doppler login` once — tokens stored in OS keyring by Doppler CLI.
#   CI/Production:   Set DOPPLER_TOKEN env var (from a Doppler service token, dp.st.xxx).
#   Never export DOPPLER_TOKEN to disk — inject at runtime via `doppler run -- <cmd>`.

[providers.searxng]
[providers.searxng.keyPool]
# SearXNG is self-hosted / operator-managed and doesn't require an API key.
keys = []
strategy = "round-robin"

[providers.searxng.options]
# Required unless SEARXNG_BASE_URL is provided in the environment.
# Do not assume localhost on this machine.
baseUrl = "https://search.example.internal"

[providers.tavily]
[providers.tavily.keyPool]
# Doppler (preferred):
keys = ["doppler:TAVILY_API_KEY_1", "doppler:TAVILY_API_KEY_2"]
strategy = "random"

[providers.exa]
[providers.exa.keyPool]
keys = ["doppler:EXA_API_KEY"]

# Exa-specific options (config-driven, never CLI flags)
[providers.exa.options]
# highlights = true          # Token-efficient excerpts (10x token reduction for agents)
# category = "company"       # Specialized index: company, people

# Exa-specific options (config-driven, never CLI flags)
[providers.exa.options]
# highlights = true          # Token-efficient excerpts (10x token reduction for agents)
# category = "company"       # Specialized index: company, people

[providers.brave]
[providers.brave.keyPool]
keys = ["doppler:BRAVE_API_KEY"]

[providers.serper]
[providers.serper.keyPool]
keys = ["doppler:SERPER_API_KEY"]

[providers.jina]
[providers.jina.keyPool]
# Jina AI Reader doesn't require an API key for basic usage
keys = []

[providers.firecrawl]
[providers.firecrawl.keyPool]
keys = ["doppler:FIRECRAWL_API_KEY"]

# ============================================
# DOPPLER SETUP (remove BWS section below)
# ============================================
# 1. Authenticate: doppler login
# 2. In Doppler, create secrets matching the names above (e.g., TAVILY_API_KEY_1)
# 3. Never set secrets in the config file — only store secret NAMES, not values
#
# For CI, create a Doppler service token and pass via DOPPLER_TOKEN env var:
#   doppler configs tokens create ci-token --project coldsearch --config prd --plain
#
# Run locally with secrets injected:
#   doppler run -- coldsearch search "query"
#
# Or set token in environment (CI pattern):
#   DOPPLER_TOKEN=dp.st.xxx coldsearch search "query"

# ============================================
# BITWARDEN SECRETS MANAGER (REMOVED)
# ============================================
# Bitwarden Secrets Manager support has been removed. A `bws:` key reference now
# raises an error at resolution time instead of being honored.
# Migrate each `bws:` ref to a `doppler:` or `env:` ref:
#   doppler:SECRET_NAME   (preferred)   or   env:VAR_NAME

# ============================================
# USAGE EXAMPLES
# ============================================
# 
# Search (random provider from 4, random key):
#   coldsearch search "machine learning"
#
# Extract (random provider from 3):
#   coldsearch extract "https://example.com/article"
#
# Crawl (random provider from 2):
#   coldsearch crawl "https://docs.example.com"
#
# Force specific provider:
#   coldsearch search --providers tavily "query"
#
# Force single provider mode explicitly:
#   coldsearch search --single-provider "query"

# ============================================
# USAGE LOGGING (OPTIONAL)
# ============================================
# Usage logs are written as JSONL for operational visibility.
# Default: ~/.config/coldsearch/usage.jsonl
#
#[logging.usage]
#path = "~/.config/coldsearch/usage.jsonl"

# ============================================
# RESULT CACHE (OPTIONAL)
# ============================================
# Read-through cache for `search` and `extract`. On by default; a hit serves
# without calling any provider. Bypass per-call with --no-cache, or disable
# entirely with enabled = false. Crawl is never cached in A1.
# Default storage path: ~/.config/coldsearch/cache
[cache]
enabled = true
search_ttl = "6h"
extract_ttl = "24h"
# path = "~/.config/coldsearch/cache"
