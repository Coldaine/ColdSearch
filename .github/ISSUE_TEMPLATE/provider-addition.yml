name: Provider Addition
description: Track adoption of a new provider or major provider-surface expansion.
title: "[provider] "
labels:
  - provider
body:
  - type: input
    id: provider
    attributes:
      label: Provider name
      placeholder: SearXNG
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: Why add this provider?
      description: Explain the overlap, differentiation, and expected value.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Initial capability scope
      description: Which normalized ColdSearch capabilities should be implemented first?
    validations:
      required: true
  - type: checkboxes
    id: docs
    attributes:
      label: Documentation requirements
      options:
        - label: A Dual Matrix row will be added/updated in `docs/PROVIDERS.md`
        - label: A vendor-tool section will be added/updated in `docs/PROVIDERS.md`
