# SonarCloud Automatic Analysis configuration.
#
# IMPORTANT: Automatic Analysis IGNORES `sonar-project.properties`. This file
# (`.sonarcloud.properties`) is the one it actually reads. It honors a limited
# set of keys: sonar.sources/exclusions/inclusions, sonar.tests/test.exclusions,
# sonar.sourceEncoding, sonar.cpd.exclusions. (sonar.issue.ignore.multicriteria
# is NOT honored here — suppress a specific rule in code or in the dashboard.)
# Docs: https://docs.sonarsource.com/sonarqube-cloud/analyzing-source-code/automatic-analysis/

# Repetitive fixture/setup boilerplate in the test suite is expected and should
# not trip the "duplication on new code" quality-gate condition.
sonar.cpd.exclusions=test/**
